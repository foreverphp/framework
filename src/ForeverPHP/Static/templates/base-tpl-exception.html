  <style>
      body {
        background-color: #a4af58;
        color: #252525;
        font-family: "Roboto", sans-serif;
        margin: 0;
        padding: 40px 20px;
      }

      .logo-header {
        max-width: 70%;
        margin: 0 auto 20px auto;
        text-align: right;
      }

      .logo {
        max-height: 80px;
        width: auto;
      }

      .container {
        max-width: 70%;
        margin: 0 auto;
        background: #fefefe;
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }

      h1 {
        color: #5a6410;
        font-size: 24px;
        margin: 0 0 20px 0;
        padding-bottom: 10px;
        border-bottom: 2px solid #5a6410;
      }

      .error {
        background: #fff5f5;
        border-left: 4px solid #d32f2f;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      /* Error Fatal - Rojo oscuro */
      .error.error-fatal {
        background: #ffebee;
        border-left-color: #c62828;
      }
      .error.error-fatal .value.type {
        color: #c62828;
      }

      /* Warning - Naranja */
      .error.error-warning {
        background: #fff3e0;
        border-left-color: #f57c00;
      }
      .error.error-warning .value.type {
        color: #f57c00;
      }

      /* Notice - Azul */
      .error.error-notice {
          background: #e3f2fd;
          border-left-color: #1976d2;
      }
      .error.error-notice .value.type {
        color: #1976d2;
      }

      /* Deprecated - Púrpura */
      .error.error-deprecated {
        background: #f3e5f5;
        border-left-color: #7b1fa2;
      }
      .error.error-deprecated .value.type {
        color: #7b1fa2;
      }

      /* General/Exception - Rojo normal (por defecto) */
      .error.error-general,
      .error.error-exception {
        background: #fff5f5;
        border-left-color: #d32f2f;
      }
      .error.error-general .value.type,
      .error.error-exception .value.type {
        color: #d32f2f;
      }

      .error-line {
        margin: 8px 0;
        line-height: 1.6;
      }

      .hurray {
        color: #5a6410;
        font-size: 24px;
        margin: 0;
        border-bottom: 0;
      }

      .label {
        font-weight: 700;
        color: #555;
        display: inline-block;
        min-width: 90px;
      }

      .stack-trace {
        background: #f4f4f4;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 12px;
        margin: 8px 0;
        line-height: 1.6;
        overflow-x: auto;
        color: #252525;
      }

      .value {
        color: #333;
      }

      .value.type {
        color: #d32f2f;
        font-weight: 600;
      }

      .value.file {
        font-family: monospace;
        font-size: 13px;
        color: #1976d2;
      }

      .value.line {
        color: #d32f2f;
        font-weight: 600;
      }

      .value.timestamp {
        color: #777;
        font-size: 14px;
      }
  </style>
</head>
